name: Pack and Push to GitHub Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BibliotecaComun.sln

      - name: Build (Release)
        run: dotnet build BibliotecaComun.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Divinf.Common.Sql.Tests/Divinf.Common.Sql.Tests.csproj -c Release --no-build --logger "trx"

      - name: Pack
        run: dotnet pack src/Divinf.Common.Sql/Divinf.Common.Sql.csproj -c Release -o ./nupkgs --no-build

      - name: Push to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget update source "github" `
            --source "https://nuget.pkg.github.com/RominaSanzi/index.json" `
            --username "RominaSanzi" `
            --password "$env:GH_TOKEN" `
            --store-password-in-clear-text
          Get-ChildItem -Path "./nupkgs/*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --source "github" --api-key "$env:GH_TOKEN" --skip-duplicate
          }
