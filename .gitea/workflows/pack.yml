name: Pack and Push to Gitea NuGet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BibliotecaComun.sln

      - name: Build (Release)
        run: dotnet build BibliotecaComun.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Divinf.Common.Sql.Tests/Divinf.Common.Sql.Tests.csproj -c Release --no-build --logger "trx"

      - name: Pack
        run: dotnet pack src/Divinf.Common.Sql/Divinf.Common.Sql.csproj -c Release -o ./nupkgs --no-build

      - name: Push to Gitea Package Registry
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
        run: |
          dotnet nuget add source "https://gitea.tu-org/api/packages/divinf/nuget/index.json" `
            --name "Divinf" `
            --username "ci-bot" `
            --password "$env:GITEA_TOKEN" `
            --store-password-in-clear-text
          dotnet nuget push ./nupkgs/*.nupkg --source "Divinf" --api-key "$env:GITEA_TOKEN" --skip-duplicate
